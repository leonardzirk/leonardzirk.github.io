<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram.exe — Seibert collection x Leo's Birthday</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --w95-face: #c0c0c0;
    --w95-shadow: #808080;
    --w95-dark: #000;
    --w95-light: #fff;
    --w95-blue: #000080;
    --w95-teal: #008080;
  }
  html, body { height: 100%; }
  body {
    font-family: "MS Sans Serif", "Pixelated MS Sans Serif", Tahoma, Geneva, sans-serif;
    font-size: 13px;
    background: var(--w95-teal);
    color: #000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
    min-height: 100vh;
  }
  @media (max-width: 640px) { body { padding: 8px; } }
  /* raised / sunken bevels */
  .raised {
    border-top: 2px solid var(--w95-light);
    border-left: 2px solid var(--w95-light);
    border-right: 2px solid var(--w95-dark);
    border-bottom: 2px solid var(--w95-dark);
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 var(--w95-shadow);
  }
  .sunken {
    border-top: 2px solid var(--w95-dark);
    border-left: 2px solid var(--w95-dark);
    border-right: 2px solid var(--w95-light);
    border-bottom: 2px solid var(--w95-light);
    box-shadow: inset 1px 1px 0 var(--w95-shadow), inset -1px -1px 0 #dfdfdf;
  }

  .win {
    width: 100%;
    max-width: 720px;
    height: 92vh;              /* fallback */
    height: 92dvh;            /* dynamic viewport, correct on mobile + iframe */
    max-height: 900px;
    min-height: 480px;        /* never collapse in an iframe with no height ctx */
    background: var(--w95-face);
    display: flex;
    flex-direction: column;
  }

  /* Title bar */
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 4px;
    margin: 2px;
    flex-shrink: 0;
  }
  .titlebar .ico { width: 16px; height: 16px; image-rendering: pixelated; border-radius: 3px; }
  .titlebar .tt { flex: 1; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tb-btns { display: flex; gap: 2px; }
  .tb-btn {
    width: 18px; height: 16px;
    background: var(--w95-face);
    font-size: 11px; line-height: 12px;
    font-weight: 700; color: #000;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: monospace;
  }

  /* Menu bar */
  .menubar {
    display: flex; gap: 2px;
    padding: 2px 4px;
    background: var(--w95-face);
    border-bottom: 1px solid var(--w95-shadow);
    flex-shrink: 0;
  }
  .menubar span { padding: 2px 8px; cursor: default; }
  .menubar span:hover { background: var(--w95-blue); color: #fff; }
  .menubar u { text-decoration: underline; }

  /* Profile header */
  .profile {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 14px 16px 10px;
    flex-shrink: 0;
  }
  .avatar {
    width: 78px; height: 78px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    image-rendering: auto;
  }
  .pf-right { flex: 1; }
  .pf-handle { font-weight: 700; font-size: 15px; text-align: center; margin-bottom: 8px; }
  .stats { display: flex; justify-content: space-around; text-align: center; margin-bottom: 8px; }
  .stats b { display: block; font-size: 15px; }
  .stats span { font-size: 12px; }
  .followbtn {
    width: 100%; padding: 6px; background: var(--w95-face);
    font-weight: 700; cursor: pointer; text-align: center;
    font-family: inherit; font-size: 13px;
  }
  .bio { padding: 0 16px 8px; flex-shrink: 0; }
  .bio .co { font-weight: 700; }
  .bio a { color: #0000ee; }

  /* tab strip */
  .tabs {
    display: flex; gap: 4px; padding: 6px 8px; flex-shrink: 0;
    border-top: 1px solid var(--w95-light);
  }
  .tab { flex: 1; text-align: center; padding: 5px; background: var(--w95-face); cursor: pointer; }

  /* Grid */
  .gridwrap {
    flex: 1; min-height: 0;
    margin: 0 6px 6px;
    background: #fff;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 3px;
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    background: #ddd;
    cursor: pointer;
    overflow: hidden;
  }
  .cell img, .cell video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .cell .play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    pointer-events: none;
  }
  .cell:hover img, .cell:hover video { opacity: 0.85; }

  /* status bar */
  .statusbar {
    display: flex; gap: 6px; padding: 2px 4px; margin: 0 2px 2px;
    font-size: 11px; flex-shrink: 0;
  }
  .statusbar .seg { padding: 2px 6px; flex: 1; }
  .statusbar .seg:last-child { flex: 0 0 auto; }

  /* Lightbox window */
  .lb-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .lb-overlay.open { display: flex; }
  .lb-win {
    background: var(--w95-face);
    max-width: 94vw; max-height: 92vh;
    display: flex; flex-direction: column;
  }
  .lb-body {
    margin: 3px; background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .lb-body img, .lb-body video {
    max-width: 88vw; max-height: 78vh; display: block;
  }
  .lb-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 6px; gap: 8px; flex-shrink: 0;
  }
  .lb-nav button {
    background: var(--w95-face); font-family: inherit; font-size: 12px;
    padding: 3px 12px; cursor: pointer;
  }
  .lb-count { font-size: 12px; }
  .raised, .sunken, .followbtn, .tab, .tb-btn, .lb-nav button {
    /* apply bevel to interactive chrome */
  }
</style>
</head>
<body>
  <div class="win raised">
    <div class="titlebar">
      <img class="ico" src="seibert-icon.png" alt="">
      <span class="tt">Instagram.exe</span>
      <span class="tb-btns">
        <span class="tb-btn raised">_</span>
        <span class="tb-btn raised">&#9633;</span>
        <span class="tb-btn raised" onclick="history.length>1?history.back():window.close()">&#10005;</span>
      </span>
    </div>
    <div class="menubar">
      <span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>V</u>iew</span>
      <span><u>O</u>ptions</span><span><u>H</u>elp</span>
    </div>

    <div class="profile">
      <img class="avatar sunken" src="seibert-icon.png" alt="Seibert collection">
      <div class="pf-right">
        <div class="stats">
          <div><b id="postcount">0</b><span>posts</span></div>
          <div><b>1</b><span>collection</span></div>
          <div><b>&#8734;</b><span>memories</span></div>
        </div>
        <div class="followbtn raised">+ Follow</div>
      </div>
    </div>
    <div class="bio">
      <div class="co">Seibert collection x Leo&#39;s Birthday</div>
      <div>A gift, archived. &#127874;</div>
      <a href="https://leonardzirk.github.io/" target="_top">leonardzirk.github.io</a>
    </div>

    <div class="tabs">
      <div class="tab sunken">&#9638;&#9638;&#9638;</div>
      <div class="tab raised">&#9776;</div>
      <div class="tab raised">&#9673;</div>
    </div>

    <div class="gridwrap sunken">
      <div class="grid" id="grid"></div>
    </div>

    <div class="statusbar">
      <span class="seg sunken" id="status">Ready</span>
      <span class="seg sunken" id="statuscount"></span>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lb-overlay" id="lightbox">
    <div class="lb-win raised">
      <div class="titlebar">
        <img class="ico" src="seibert-icon.png" alt="">
        <span class="tt" id="lb-title">image</span>
        <span class="tb-btns">
          <span class="tb-btn raised" id="lb-close">&#10005;</span>
        </span>
      </div>
      <div class="lb-body sunken" id="lb-body"></div>
      <div class="lb-nav">
        <button class="raised" id="lb-prev">&#8592; Back</button>
        <span class="lb-count" id="lb-count"></span>
        <button class="raised" id="lb-next">Next &#8594;</button>
      </div>
    </div>
  </div>

<script>
  const ASSETS = [{"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0857.JPG", "name": "IMG_0857.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_1052.jpg", "name": "IMG_1052.jpg", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0867.JPG", "name": "IMG_0867.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0900.JPG", "name": "IMG_0900.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0830.JPG", "name": "IMG_0830.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0829.JPG", "name": "IMG_0829.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0849.JPG", "name": "IMG_0849.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0880.JPG", "name": "IMG_0880.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_1056.jpg", "name": "IMG_1056.jpg", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0820.JPG", "name": "IMG_0820.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0722.JPG", "name": "IMG_0722.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0886.JPG", "name": "IMG_0886.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/b3e5ed97-6d34-4772-96d6-649a9573b45c.JPG", "name": "b3e5ed97-6d34-4772-96d6-649a9573b45c.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/e3ac6685-e113-4146-8f2b-307f61c652fb.JPG", "name": "e3ac6685-e113-4146-8f2b-307f61c652fb.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/de4767ba-289b-4f9c-9cb2-2c934348a935.JPG", "name": "de4767ba-289b-4f9c-9cb2-2c934348a935.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/20ca955e-592d-4144-8b85-be314b051df0.JPG", "name": "20ca955e-592d-4144-8b85-be314b051df0.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/e2354a48-08dc-4da4-a487-3c782d8da44b.JPG", "name": "e2354a48-08dc-4da4-a487-3c782d8da44b.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/49f91bef-15b1-4510-b8d6-5014e5bc8d5c.JPG", "name": "49f91bef-15b1-4510-b8d6-5014e5bc8d5c.JPG", "type": "image"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0798.MOV", "name": "IMG_0798.MOV", "type": "video"}, {"url": "https://ik.imagekit.io/b85jlqldz/Seibert%20collection%20x%20Leo's%20Birthday/Ulli%20x%20Leo%20/IMG_0893.MOV", "name": "IMG_0893.MOV", "type": "video"}];
  const grid = document.getElementById('grid');
  const postcount = document.getElementById('postcount');
  const statuscount = document.getElementById('statuscount');
  postcount.textContent = ASSETS.length;
  statuscount.textContent = ASSETS.length + ' item(s)';

  ASSETS.forEach((a, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.tabIndex = 0;
    cell.setAttribute('role', 'button');
    cell.setAttribute('aria-label', 'Open ' + (a.name || ('item ' + (i+1))));
    if (a.type === 'video') {
      const v = document.createElement('video');
      v.src = a.url + '#t=0.1';
      v.muted = true; v.playsInline = true; v.preload = 'metadata';
      cell.appendChild(v);
      const play = document.createElement('div');
      play.className = 'play'; play.textContent = '\u25B6';
      cell.appendChild(play);
    } else {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = a.url;
      img.alt = a.name || '';
      cell.appendChild(img);
    }
    cell.addEventListener('click', () => openLightbox(i));
    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
    });
    grid.appendChild(cell);
  });

  // Lightbox
  const lb = document.getElementById('lightbox');
  const lbBody = document.getElementById('lb-body');
  const lbTitle = document.getElementById('lb-title');
  const lbCount = document.getElementById('lb-count');
  let cur = 0;

  function render() {
    const a = ASSETS[cur];
    lbBody.innerHTML = '';
    if (a.type === 'video') {
      const v = document.createElement('video');
      v.src = a.url; v.controls = true; v.autoplay = true; v.playsInline = true;
      lbBody.appendChild(v);
    } else {
      const img = document.createElement('img');
      img.src = a.url; img.alt = a.name || '';
      lbBody.appendChild(img);
    }
    lbTitle.textContent = a.name || ('item ' + (cur + 1));
    lbCount.textContent = (cur + 1) + ' / ' + ASSETS.length;
  }
  function openLightbox(i) { cur = i; render(); lb.classList.add('open'); }
  function closeLightbox() { lb.classList.remove('open'); lbBody.innerHTML = ''; }
  function step(d) { cur = (cur + d + ASSETS.length) % ASSETS.length; render(); }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => step(-1));
  document.getElementById('lb-next').addEventListener('click', () => step(1));
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>
</body>
</html>
